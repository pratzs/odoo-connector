<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #fff; /* White background to blend with dashboard card */
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Toolbar Styling */
        .log-toolbar {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 10px 15px;
            flex-shrink: 0;
        }

        /* Log Container */
        .log-container {
            flex: 1;
            overflow-y: auto;
            padding: 0; /* No padding on container for max space */
            background-color: #fff;
            scrollbar-width: thin;
        }

        /* Scrollbar Polish */
        .log-container::-webkit-scrollbar { width: 6px; }
        .log-container::-webkit-scrollbar-track { background: transparent; }
        .log-container::-webkit-scrollbar-thumb { background-color: #adb5bd; border-radius: 3px; }

        /* Log Item Styling */
        .log-item {
            padding: 10px 15px;
            border-bottom: 1px solid #f1f3f5;
            animation: fadeIn 0.2s ease-out;
            transition: background-color 0.1s;
        }
        .log-item:hover { background-color: #f8f9fa; }
        
        .log-item:last-child { border-bottom: none; }

        /* Status Colors */
        .border-left-indicator { border-left: 3px solid transparent; }
        .type-info { border-left-color: #0dcaf0; }
        .type-success { border-left-color: #198754; }
        .type-warning { border-left-color: #ffc107; }
        .type-error { border-left-color: #dc3545; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Status Dot Pulse */
        .status-dot {
            width: 8px; height: 8px; 
            background-color: #198754; 
            border-radius: 50%; 
            box-shadow: 0 0 0 0 rgba(25, 135, 84, 0.7);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(25, 135, 84, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 4px rgba(25, 135, 84, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(25, 135, 84, 0); }
        }
    </style>
</head>
<body>

    <div class="log-toolbar d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <div class="status-dot"></div>
            <span class="fw-semibold text-secondary" style="font-size: 0.85rem; letter-spacing: 0.5px;">ACTIVITY STREAM</span>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-light text-secondary border fw-normal">Live</span>
            <button onclick="clearLogs()" class="btn btn-sm btn-outline-secondary border-0 py-0" style="font-size: 0.8rem;" title="Clear Logs">
                <i class="bi bi-trash"></i> Clear
            </button>
        </div>
    </div>

    <div id="log-container" class="log-container">
        
        <div id="loading-state" class="d-flex flex-column align-items-center justify-content-center h-100">
            <div class="spinner-border text-secondary spinner-border-sm" role="status"></div>
            <small class="text-muted mt-2">Connecting...</small>
        </div>

        <div id="empty-state" class="d-none flex-column align-items-center justify-content-center h-100 text-center p-4">
            <i class="bi bi-terminal text-secondary opacity-25" style="font-size: 3rem;"></i>
            <p class="text-muted small mt-2">Waiting for sync activity...</p>
        </div>

        <div id="log-list"></div>
    </div>

    <script>
        const LOG_API_URL = '/api/logs/live'; 
        const urlParams = new URLSearchParams(window.location.search);
        const shopParam = urlParams.get('shop');
        const fetchUrl = shopParam ? `${LOG_API_URL}?shop=${shopParam}` : LOG_API_URL;

        const logList = document.getElementById('log-list');
        const loadingState = document.getElementById('loading-state');
        const emptyState = document.getElementById('empty-state');
        
        let isFirstLoad = true;

        const ICONS = {
            'info': 'bi-info-circle-fill text-info',
            'success': 'bi-check-circle-fill text-success',
            'warning': 'bi-exclamation-triangle-fill text-warning',
            'error': 'bi-x-circle-fill text-danger'
        };

        const TYPES = {
            'info': 'type-info',
            'success': 'type-success',
            'warning': 'type-warning',
            'error': 'type-error'
        };

        function createLogItem(log) {
            const div = document.createElement('div');
            const typeClass = TYPES[log.type] || TYPES['info'];
            div.className = `log-item border-left-indicator ${typeClass}`;
            
            const timeStr = new Date(log.timestamp).toLocaleTimeString([], { hour12: false });
            
            div.innerHTML = `
                <div class="d-flex justify-content-between align-items-start">
                    <div class="d-flex gap-2 w-100">
                        <i class="bi ${ICONS[log.type] || ICONS['info']} mt-1" style="font-size: 1rem;"></i>
                        <div class="w-100">
                            <div class="d-flex justify-content-between">
                                <span class="text-dark fw-medium" style="font-size: 0.9rem;">${escapeHtml(log.message)}</span>
                                <span class="text-muted small font-monospace ms-2 text-nowrap" style="font-size: 0.75rem;">${timeStr}</span>
                            </div>
                            ${log.details ? `<div class="text-muted small mt-1 font-monospace bg-light d-inline-block px-2 rounded border">${escapeHtml(log.details)}</div>` : ''}
                        </div>
                    </div>
                </div>
            `;
            return div;
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        let lastDataJSON = '';
        
        async function fetchLogs() {
            try {
                const res = await fetch(fetchUrl);
                const data = await res.json();

                // --- 1. SMART CHECK: Did anything actually change? ---
                // We turn the data into a string to compare it easily
                const currentDataJSON = JSON.stringify(data);
                if (currentDataJSON === lastDataJSON) {
                    return; 
                }
                lastDataJSON = currentDataJSON; 
                // ----------------------------------------------------

                if (isFirstLoad) {
                    loadingState.classList.add('d-none');
                    isFirstLoad = false;
                }

                if (data.length === 0) {
                    emptyState.classList.remove('d-none');
                    emptyState.classList.add('d-flex');
                    logList.innerHTML = '';
                    return;
                }

                emptyState.classList.add('d-none');
                emptyState.classList.remove('d-flex');
                
                // Only now do we rebuild the list
                logList.innerHTML = ''; 
                data.forEach(log => {
                    logList.appendChild(createLogItem(log));
                });

            } catch (err) { console.error("Log poll failed", err); }
        }

        function clearLogs() {
    if(confirm('Clear all logs?')) {
        const shop = shopParam || '';
        fetch(`/maintenance/wipe_logs?shop=${shop}`)
            .then(() => {
                lastDataJSON = ''; // Reset comparison so empty state shows
                fetchLogs();
            });
    }
}

        setInterval(fetchLogs, 2000);
        fetchLogs(); 
    </script>
</body>
</html>
