<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Logs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        /* Custom Scrollbar Styling */
        .log-container {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f1f5f9;
        }
        .log-container::-webkit-scrollbar {
            width: 8px;
        }
        .log-container::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .log-container::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col font-sans">

    <div class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm shrink-0">
        <div class="flex items-center gap-3">
            <div class="h-3 w-3 rounded-full bg-green-500 animate-pulse"></div>
            <h1 class="text-lg font-semibold text-slate-700 tracking-tight">Live Synchronization Logs</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="clearLogs()" class="text-xs font-medium text-slate-500 hover:text-red-600 px-3 py-1.5 rounded-md hover:bg-slate-100 transition-colors border border-transparent hover:border-slate-200">
                Clear History
            </button>
            <span class="text-xs font-medium px-2 py-1 bg-slate-100 text-slate-600 rounded border border-slate-200">
                Auto-refreshing
            </span>
        </div>
    </div>

    <div class="flex-1 p-6 overflow-hidden flex flex-col max-w-5xl mx-auto w-full">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden">
            
            <div id="log-container" class="log-container flex-1 overflow-y-auto p-4 space-y-3">
                
                <div id="loading-state" class="flex flex-col items-center justify-center h-full">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-slate-300"></div>
                    <span class="text-xs text-slate-400 mt-4">Connecting to Odoo stream...</span>
                </div>

                <div id="empty-state" class="hidden flex flex-col items-center justify-center h-full text-center">
                    <i class="bi bi-terminal text-6xl text-slate-300 mb-4"></i>
                    <h3 class="text-slate-700 font-semibold mb-1 text-base">No activity recorded yet</h3>
                    <p class="text-slate-500 text-sm max-w-xs">
                        Synchronization logs will appear here in real-time once you start a sync or receive an order.
                    </p>
                </div>

                <div id="log-list"></div>

            </div>
        </div>
    </div>

    <script>
        const LOG_API_URL = '/api/logs/live'; 
        const urlParams = new URLSearchParams(window.location.search);
        const shopParam = urlParams.get('shop');
        const fetchUrl = shopParam ? `${LOG_API_URL}?shop=${shopParam}` : LOG_API_URL;

        const container = document.getElementById('log-container');
        const logList = document.getElementById('log-list');
        const loadingState = document.getElementById('loading-state');
        const emptyState = document.getElementById('empty-state');
        
        let isFirstLoad = true;

        // Status Icons Map
        const ICONS = {
            'info': 'bi-info-circle text-blue-500',
            'success': 'bi-check-circle text-green-500',
            'warning': 'bi-exclamation-triangle text-amber-500',
            'error': 'bi-x-circle text-red-500'
        };

        const BORDERS = {
            'info': 'border-l-blue-500',
            'success': 'border-l-green-500',
            'warning': 'border-l-amber-500',
            'error': 'border-l-red-500'
        };

        function createLogItem(log) {
            const div = document.createElement('div');
            div.className = `p-3 rounded-r-lg bg-slate-50 border-l-4 ${BORDERS[log.type] || BORDERS['info']} border-y border-r border-slate-200 text-sm animate-fade-in`;
            
            const timeStr = new Date(log.timestamp).toLocaleTimeString([], { hour12: false });
            
            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <div class="flex items-start gap-3">
                        <i class="bi ${ICONS[log.type] || ICONS['info']} mt-0.5 text-base"></i>
                        <div>
                            <p class="text-slate-800 leading-snug font-medium">${escapeHtml(log.message)}</p>
                            ${log.details ? `<p class="text-xs text-slate-500 mt-1 font-mono bg-white px-1.5 py-0.5 rounded border border-slate-100 inline-block">${escapeHtml(log.details)}</p>` : ''}
                        </div>
                    </div>
                    <span class="text-xs font-mono text-slate-400 shrink-0 ml-4">${timeStr}</span>
                </div>
            `;
            return div;
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function fetchLogs() {
            try {
                const res = await fetch(fetchUrl);
                const data = await res.json();

                if (isFirstLoad) {
                    loadingState.classList.add('hidden');
                    isFirstLoad = false;
                }

                if (data.length === 0) {
                    emptyState.classList.remove('hidden');
                    logList.innerHTML = '';
                    return;
                }

                emptyState.classList.add('hidden');
                logList.innerHTML = ''; // Wipe and redraw (simple)
                data.forEach(log => {
                    logList.appendChild(createLogItem(log));
                });

            } catch (err) {
                console.error("Log poll failed", err);
            }
        }

        function clearLogs() {
             if(confirm('Clear all logs?')) {
                 fetch('/maintenance/wipe_logs').then(() => fetchLogs());
             }
        }

        setInterval(fetchLogs, 2000);
        fetchLogs(); 
    </script>
</body>
</html>
